<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Login Guru — SIAP GURU.">
  <title>Login Guru — SIAP GURU</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    .login-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%)}
    .login-card{width:min(100%,410px);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 16px 45px rgba(15,23,42,.09)}
    .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.login-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#0f172a;color:#fff;font-weight:800;font-size:14px}.login-brand strong{display:block;font-size:18px}.login-brand span{display:block;margin-top:2px;color:#64748b;font-size:13px}
    .login-title{margin:0;font-size:25px;letter-spacing:-.02em}.login-copy{margin:7px 0 22px;color:#64748b;font-size:14px;line-height:1.5}.field{margin-bottom:15px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:700;color:#334155}.field input{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;color:#0f172a;font:inherit;outline:none}.field input:focus{border-color:#64748b;box-shadow:0 0 0 3px rgba(100,116,139,.12)}.password-wrap{position:relative}.password-wrap input{padding-right:92px}.password-toggle{position:absolute;right:7px;top:7px;border:0;background:transparent;padding:7px 8px;border-radius:8px;color:#475569;font-size:12px;font-weight:700;cursor:pointer}.password-toggle:hover{background:#f1f5f9}.login-submit{width:100%;margin-top:3px;padding:12px 14px;border:0;border-radius:11px;background:#0f172a;color:#fff;font:inherit;font-weight:750;cursor:pointer}.login-submit:hover{background:#1e293b}.login-message{min-height:20px;margin:13px 0 0;font-size:12px;line-height:1.5}.login-message.error{color:#b91c1c}.login-message.info{color:#475569}.login-foot{margin-top:20px;padding-top:16px;border-top:1px solid #eef2f7;text-align:center;color:#94a3b8;font-size:11px}
    @media(max-width:480px){.login-page{padding:16px}.login-card{padding:22px;border-radius:17px}.login-title{font-size:22px}}
  </style>
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand"><div class="login-mark" aria-hidden="true">SG</div><div><strong>SIAP GURU</strong><span>Administrasi Guru SD</span></div></div>
      <h1 id="loginTitle" class="login-title">Masuk sebagai Guru</h1>
      <p class="login-copy">Gunakan NIP dan kata sandi untuk mengakses ruang kerja SIAP GURU.</p>
      <form id="loginForm" novalidate>
        <div class="field"><label for="nip">NIP</label><input id="nip" name="nip" type="text" inputmode="numeric" autocomplete="username" placeholder="Masukkan NIP" required></div>
        <div class="field"><label for="password">Kata sandi</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required><button id="togglePassword" class="password-toggle" type="button" aria-pressed="false">Tampilkan</button></div></div>
        <button class="login-submit" type="submit">Masuk</button>
        <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
      </form>
      <div class="login-foot">SIAP GURU • Fase 2 — Login Guru</div>
    </section>
  </main>
  <script src="assets/js/login.js" defer></script>
</body>
</html>
