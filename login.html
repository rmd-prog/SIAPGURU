<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="Login Guru — SIAP GURU.">
  <title>Login Guru — SIAP GURU</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="login-body">
  <main class="login-page">
    <section class="login-panel" aria-label="Login SIAP GURU">
      <div class="login-brand">
        <div class="login-mark">SG</div>
        <div><strong>SIAP GURU</strong><span>Administrasi Guru SD</span></div>
      </div>
      <div class="login-heading">
        <span class="login-kicker">RUANG GURU</span>
        <h1>Selamat datang</h1>
        <p>Masuk untuk melanjutkan ke ruang kerja Anda.</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="nip">NIP</label>
          <input id="nip" name="nip" type="text" inputmode="numeric" autocomplete="username" placeholder="Masukkan NIP" required>
        </div>
        <div class="field">
          <label for="password">Kata sandi</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
            <button id="togglePassword" class="password-toggle" type="button" aria-pressed="false">Tampilkan</button>
          </div>
        </div>
        <button class="login-submit" type="submit">Masuk ke SIAP GURU</button>
        <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
      </form>
      <div class="login-foot">SIAP GURU <span>•</span> Administrasi Guru SD</div>
    </section>
  </main>
  <script src="assets/js/login.js" defer></script>
</body>
</html>
