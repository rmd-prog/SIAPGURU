name: SIAP GURU RPM Daily Meeting Loader
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/siap-guru-rpm-meeting-engine-v1.js'
      - 'index.html'
      - '.github/workflows/siapguru-rpm-meeting-loader.yml'
permissions:
  contents: write
jobs:
  load-rpm-meeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure universal RPM meeting engine is loaded
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          name='siap-guru-rpm-meeting-engine-v1.js'
          s=re.sub(r'<script src="assets/js/'+re.escape(name)+r'(?:\?[^\"]*)?" defer></script>','',s)
          tag='<script src="assets/js/'+name+'?v=1" defer></script>'
          anchor='<script src="assets/js/siap-guru-rpm-context-v4.js?v=2" defer></script>'
          if anchor in s:
              s=s.replace(anchor,anchor+tag)
          p.write_text(s,encoding='utf-8')
      - name: Commit index loader
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: load universal RPM daily meeting engine'
          git push
