name: SIAP GURU RPM Final Loader
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/siap-guru-rpm-time-final-v1.js'
      - 'index.html'
      - '.github/workflows/siapguru-rpm-loader.yml'
permissions:
  contents: write
jobs:
  load-rpm-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject RPM final timing script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="assets/js/siap-guru-rpm-time-final-v1.js?v=1" defer></script>'
          anchor='<script src="assets/js/siap-guru-rpm-final-v1.js?v=7" defer></script>'
          if marker not in s:
              if anchor not in s: raise SystemExit('RPM final anchor not found')
              s=s.replace(anchor,anchor+marker,1)
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: load SIAP GURU RPM final timing'
          git push
