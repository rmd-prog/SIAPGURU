name: SIAP GURU RPM Final Loader
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/siap-guru-rpm-time-final-v1.js'
      - 'assets/js/siap-guru-rpm-topic-sync-v1.js'
      - 'assets/js/siap-guru-rpm-author-sync-v1.js'
      - 'assets/js/siap-guru-master-bab-v1.js'
      - 'assets/js/siap-guru-rpm-context-v4.js'
      - 'index.html'
      - '.github/workflows/siapguru-rpm-loader.yml'
permissions:
  contents: write
jobs:
  load-rpm-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep RPM Deep Learning loaders stable
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          legacy=['siap-guru-rpm-syntax-v2.js','siap-guru-rpm-scope-v1.js','siap-guru-rpm-narrative-v1.js','siap-guru-rpm-assessment-v1.js','siap-guru-rpm-scope-planner-v1.js','siap-guru-rpm-alignment-v1.js','siap-guru-rpm-quality-v1.js','siap-guru-rpm-final-v1.js','siap-guru-rpm-cp-final-v1.js','siap-guru-rpm-date-engine-v1.js','siap-guru-rpm-date-bridge-v1.js','siap-guru-rpm-date-bridge-v2.js','siap-guru-rpm-date-bridge-v3.js','siap-guru-rpm-context-v2.js','siap-guru-rpm-context-v3.js']
          for name in legacy:
              s=re.sub(r'<script src="assets/js/'+re.escape(name)+r'(?:\?[^\"]*)?" defer></script>','',s)
          state=[s]
          def ensure(name,anchor,version):
              state[0]=re.sub(r'<script src="assets/js/'+re.escape(name)+r'(?:\?[^\"]*)?" defer></script>','',state[0])
              tag=f'<script src="assets/js/{name}?v={version}" defer></script>'
              if anchor in state[0]: state[0]=state[0].replace(anchor,anchor+tag)
          rpm='<script src="assets/js/siap-guru-rpm.js?v=7" defer></script>'
          ensure('siap-guru-rpm-time-final-v1.js',rpm,'3')
          rpm='<script src="assets/js/siap-guru-rpm-time-final-v1.js?v=3" defer></script>'
          ensure('siap-guru-rpm-author-sync-v1.js',rpm,'2')
          rpm='<script src="assets/js/siap-guru-rpm-author-sync-v1.js?v=2" defer></script>'
          ensure('siap-guru-master-bab-v1.js',rpm,'1')
          rpm='<script src="assets/js/siap-guru-master-bab-v1.js?v=1" defer></script>'
          ensure('siap-guru-rpm-topic-sync-v1.js',rpm,'2')
          rpm='<script src="assets/js/siap-guru-rpm-topic-sync-v1.js?v=2" defer></script>'
          ensure('siap-guru-rpm-context-v4.js',rpm,'2')
          p.write_text(state[0],encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: load RPM V4 as sole semantic engine'
          git push
