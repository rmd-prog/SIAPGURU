# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare RPM route bridge and repair RPM syntax
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          rpm = Path('assets/js/siap-guru-rpm.js')
          text = rpm.read_text(encoding='utf-8')
          broken = "Refleksi Peserta Didik: ${state.studentReflect||'Catat hal yang dipahami, dirasakan, dan perlu diperbaiki.'"
          fixed = "Refleksi Peserta Didik: ${state.studentReflect||'Catat hal yang dipahami, dirasakan, dan perlu diperbaiki.'}"
          if broken not in text:
              raise SystemExit('RPM reflection syntax marker not found; refusing deployment')
          text = text.replace(broken, fixed, 1)
          needle = 'const boot=()=>{'
          replacement = 'const boot=window.__openSiapGuruRPM=()=>{'
          if needle not in text:
              raise SystemExit('RPM boot marker not found; refusing deployment')
          text = text.replace(needle, replacement, 1)
          rpm.write_text(text, encoding='utf-8')
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          tag = '<script src="assets/js/siap-guru-rpm-route-bridge.js?v=2" defer></script>'
          if 'assets/js/siap-guru-rpm-route-bridge.js?' not in html:
              html = html.replace('</body>', tag + '</body>', 1)
          else:
              import re
              html = re.sub(r'<script src="assets/js/siap-guru-rpm-route-bridge\.js\?v=\d+" defer></script>', tag, html, count=1)
          index.write_text(html, encoding='utf-8')
          PY
          node --check assets/js/siap-guru-rpm.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
