# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare RPM route bridge
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          rpm = Path('assets/js/siap-guru-rpm.js')
          text = rpm.read_text(encoding='utf-8')
          needle = 'const boot=()=>{'
          replacement = 'window.__openSiapGuruRPM=()=>{'
          if needle not in text:
              raise SystemExit('RPM boot marker not found; refusing deployment')
          rpm.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          tag = '<script src="assets/js/siap-guru-rpm-route-bridge.js?v=1" defer></script>'
          if tag not in html:
              html = html.replace('</body>', tag + '</body>', 1)
              index.write_text(html, encoding='utf-8')
          PY
          node --check assets/js/siap-guru-rpm.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
