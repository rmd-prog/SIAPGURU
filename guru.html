<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Guru — SIAP GURU</title><link rel="stylesheet" href="assets/css/app.css">
<style>
body{background:#f8fafc}.page{max-width:1000px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.title h1{margin:0;font-size:26px}.title p{margin:5px 0 0;color:#64748b;font-size:14px}.back{padding:9px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#334155;text-decoration:none;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px}.card h2{margin:0 0 15px;font-size:17px}.field{margin-bottom:13px}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:700;color:#475569}.field input,.field select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit}.actions{display:flex;gap:8px;margin-top:16px}.btn{padding:10px 14px;border-radius:9px;border:1px solid #cbd5e1;background:#fff;font-weight:700;cursor:pointer}.primary{background:#0f172a;color:#fff;border-color:#0f172a}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #e2e8f0;white-space:nowrap}.table th{color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.04em}.empty{text-align:center;color:#94a3b8;padding:24px}.note{margin-top:16px;color:#64748b;font-size:12px}.toast{min-height:18px;margin-top:10px;font-size:12px;color:#475569}@media(max-width:700px){.page{padding:16px}.grid{grid-template-columns:1fr}.head{align-items:flex-start}.title h1{font-size:22px}}
</style>
</head>
<body><main class="page">
<header class="head"><div class="title"><h1>Data Guru</h1><p>Kelola identitas guru dan rombel untuk fondasi SIAP GURU.</p></div><a class="back" href="dashboard.html">← Dashboard</a></header>
<section class="grid">
<article class="card"><h2>Profil Guru</h2><div class="field"><label for="nama">Nama Guru</label><input id="nama" placeholder="Nama lengkap"></div><div class="field"><label for="nip">NIP</label><input id="nip" inputmode="numeric" placeholder="NIP"></div><div class="field"><label for="role">Peran</label><select id="role"><option>Guru</option><option>Guru Kelas</option><option>Guru Mata Pelajaran</option></select></div><div class="actions"><button id="saveGuru" class="btn primary" type="button">Simpan Profil</button></div><div id="message" class="toast" role="status"></div></article>
<article class="card"><h2>Rombel</h2><div class="field"><label for="rombel">Tambah Rombel</label><input id="rombel" placeholder="Contoh: IVA"></div><div class="actions"><button id="addRombel" class="btn primary" type="button">Tambah Rombel</button></div><div id="rombelMessage" class="toast" role="status"></div></article>
</section>
<section class="card" style="margin-top:16px"><h2>Daftar Rombel</h2><div class="table-wrap"><table class="table"><thead><tr><th>No</th><th>Rombel</th><th>Status</th></tr></thead><tbody id="rombelTable"><tr><td colspan="3" class="empty">Belum ada rombel.</td></tr></tbody></table></div><p class="note">Fase 4 menggunakan penyimpanan lokal browser sebagai fondasi UI. Database/server belum dihubungkan pada fase ini.</p></section>
</main><script src="assets/js/guru.js" defer></script></body></html>
